<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>CALCULADORA !!</title>
</head>
<body>
    <h1>CALCULE!</h1>
    <form action="#">

        <label for="valor1">Insira o primeiro valor:</label>
        <input type="text" id="txtnum1" name="valor1">
        <br>
        <label for="valor2">Insira o segundo valor:</label>
        <input type="text" id="txtnum2" name="valor2">
        <br>
        <br>
        
        <input type="text" value="+" id="btsoma" class="btn" onclick="Calcular('+')">
        <input type="text" value="-" id="btsub" class="btn" onclick="Calcular('-')" >
        <input type="text" value="x" id="btmult" class="btn" onclick="Calcular('x')">
        <input type="text" value=":" id="btdiv" class="btn" onclick="Calcular(':')">
        <br>    
        <br>

        <label for="result">O resultado é:</label>
        <input type="text" id="txtresult" name="result" disabled>

        <input type="reset" value="Limpar" id="btn-limpar" class="btn" onClick="document.getElementById('txtnum1').focus()">
    </form>
</body>
</html>
