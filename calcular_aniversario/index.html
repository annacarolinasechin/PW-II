<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/calcular_aniversario/src/css/style.css">
    <title>O dia em que nasci</title>
</head>
<body>

    <h1>O DIA EM QUE NASCI</h1>

    <form name="meuForm">
        <label>Informe o dia em que nasceu:</label>
        <input type="text" id="dia" class="input"><br><br>

        <label>Informe o mês em que nasceu:</label>
        <input type="text" id="mes" class="input"><br><br>

        <label>Informe o ano em que nasceu:</label>
        <input type="text" id="ano" class="input"><br><br>

        <label>Seu mês de nascimento é:</label>
        <input type="text" id="resMes" disabled class="input"><br><br>

        <label>O dia da semana foi:</label>
        <input type="text" id="resSemana" disabled class="input"><br><br>

        <label>Sob o signo de:</label><br>

        <label>E a sua idade é:</label>
        <input type="text" id="resIdade" disabled class="input"><br><br>

        <div class="botoes">
        <input type="button" class="rst" value="Calcular" onclick="calcular()">
        <input type="reset" class="rst" value="C" onclick="limpar()">
        </div>
    </form>

<script src="./src/js/script.js"></script>
</body>
</html>
