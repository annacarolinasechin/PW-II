<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <title>Quando você nasceu?</title>
</head>

<body>
     
    <h1>Dia que nasci</h1>

    <form action="#">
        <fieldset>
            <label for="data_ani">Informe o dia que nasceu:</label>
            <input type="text" id="dia-nasc">

                <br>
                <br>

            <label for="mes">Informe o mês em que nasceu:</label>
            <input type="text" id="mes-nasc">

                <br>
                <br>

            <label for="ano">Informe o ano em que nasceu:</label>
            <input type="text" id="ano-nasc">

                <br>
                <br>

            <label for="nascimento">Seu mês de nascimento é:</label>
            <input type="text" id="result-mes" readonly>

                <br>
                <br>

             <label for="dia">O dia da semana foi:</label>
            <input type="text" id="result-dia" readonly>

                <br>
                <br>

            <label for="sob">Sob o signo de: </label>
            <input type="" id="signo" readonly name="signo">

                <br>
                <br>

            <label for="idade">E a sua idade é:</label>
            <input type="text" id="idade" readonly>
            
            <br>
            <br>

            <input type="button" value="Exibir" id="exibir" onclick="">
            <input type="reset" value="Limpar" id="limpar" onclick="">

        </fieldset>
    </form>

<script src="src/js/script.js"></script>
</body>
</html>
